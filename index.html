
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sup-marine</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>SUP-MARINE</h1>
  <p class="tagline">We search out and destroy overpriced supplements.</p>
</header>

<section class="search">
  <input type="text" id="searchBox" placeholder="Search supplements (e.g. whey protein)">
  <button onclick="search()">Sonar Scan</button>
</section>

<section id="results">
  <h2>Targets Found</h2>
  <div class="result">
    <h3>Example Whey Protein</h3>
    <p>Amazon - £42</p>
  </div>
  <div class="result">
    <h3>Example Whey Protein</h3>
    <p>MyProtein - £38</p>
  </div>
</section>

<footer>
  <p>© Sup-marine</p>
</footer>

<script src="script.js"></script>
</body>
</html>
